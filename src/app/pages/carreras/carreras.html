<!-- preventOpenDuplicates: no repite un aviso que ya esta en pantalla -->
<p-toast preventOpenDuplicates />

<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="Nueva" icon="pi pi-plus" severity="secondary" (onClick)="nuevo()" />
    </ng-template>
    <ng-template #end>
        <p-button label="Recargar" icon="pi pi-refresh" severity="secondary" [loading]="cargando()" (onClick)="cargar()" />
    </ng-template>
</p-toolbar>

<p-table
    #dt
    [value]="carreras()"
    [loading]="cargando()"
    [rows]="10"
    [paginator]="true"
    [globalFilterFields]="['idCarrera', 'descripcion']"
    [rowHover]="true"
    dataKey="idCarrera"
    currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} carreras"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 20, 30]"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Carreras</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="filtrar(dt, $event)" placeholder="Buscar..." />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="idCarrera" style="width: 8rem">Id <p-sortIcon field="idCarrera" /></th>
            <th pSortableColumn="descripcion">Descripción <p-sortIcon field="descripcion" /></th>
            <th style="width: 8rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-carrera>
        <tr>
            <td>{{ carrera.idCarrera }}</td>
            <td>{{ carrera.descripcion }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editar(carrera)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="eliminar(carrera)" />
            </td>
        </tr>
    </ng-template>
    <ng-template #emptymessage>
        <tr>
            <td colspan="3">No hay carreras registradas.</td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="dialogo" [style]="{ width: '450px' }" [header]="idEdicion ? 'Editar carrera' : 'Nueva carrera'" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">
            <div>
                <label for="descripcion" class="block font-bold mb-3">Descripción</label>
                <input type="text" pInputText id="descripcion" [(ngModel)]="form.descripcion" maxlength="10" required autofocus fluid />
                @if (enviado() && !form.descripcion.trim()) {
                    <small class="text-red-500">La descripción es requerida.</small>
                }
            </div>
        </div>
    </ng-template>
    <ng-template #footer>
        <p-button label="Cancelar" icon="pi pi-times" text (click)="dialogo.set(false)" />
        <p-button label="Guardar" icon="pi pi-check" [loading]="guardando()" (click)="guardar()" />
    </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
